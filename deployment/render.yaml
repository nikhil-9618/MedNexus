# ---------------------------------------------------------------------------
# MedNexus — Render Blueprint (API)
#
# 1. Push this repository to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick the repo (or paste this file).
# 3. Render prompts for every `sync: false` variable — paste the real values.
#
# The API is a plain Node service; no Docker required. `src/server` is an npm
# workspace, and Render installs it standalone from that root directory.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: mednexus-api
    runtime: node
    plan: free
    region: singapore
    rootDir: src/server
    # --workspaces=false keeps this a standalone install of src/server only.
    # Without it npm resolves the repository's workspace root and installs the
    # client's production dependencies (three.js, recharts, react) too, which
    # the API never uses. src/server/package-lock.json makes the install
    # reproducible; it is generated with the same flag.
    buildCommand: npm ci --omit=dev --omit=optional --workspaces=false
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the API reads it from the environment.
      - key: MONGODB_URI
        sync: false # mongodb+srv://user:pass@cluster.mongodb.net/mednexus
      - key: JWT_SECRET
        generateValue: true # Render generates a 64-char secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # https://your-frontend.vercel.app (comma-separate extras)
      # Render terminates TLS at the edge and forwards X-Forwarded-Proto.
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Real email delivery for signup verification codes. Configure ONE of the
      # two transports below, or no patient can ever complete signup. The API
      # reports which one it chose on boot. Without either, set OTP_DEV_ECHO.
      #
      # (a) Resend — needs a domain verified at resend.com, because its shared
      #     sender only delivers to the Resend account owner.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # MedNexus <no-reply@your-verified-domain>
      # (b) SMTP — works with any provider, and is the only option that reaches
      #     arbitrary recipients without owning a verified domain (e.g. a Gmail
      #     account with a 16-character app password, smtp.gmail.com:587).
      #     Set SMTP_HOST, SMTP_USER and SMTP_PASS to enable it; SMTP_PORT
      #     defaults to 587 with STARTTLS.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Reference data (departments and settings — NO accounts) is written on
      # first boot. The first administrator comes from ADMIN_* below.
      - key: SEED_ON_EMPTY
        value: "true"
      # Escape hatch, not a feature: echoes the verification code back to the
      # client over HTTP. Type "true" ONLY if you skipped both transports above
      # and still need signup to be walkable; it makes email verification
      # cosmetic, so leave it blank for anything real.
      - key: OTP_DEV_ECHO
        sync: false
      # The first administrator. No accounts are seeded, so without this the
      # deployment has nobody who can sign in. Run once, in the Render shell:
      #   npm run create-admin
      # ADMIN_PASSWORD is optional — omit it and the command generates and
      # prints a strong one.
      - key: ADMIN_EMAIL
        sync: false # you@your-clinic.example
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
