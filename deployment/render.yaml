# ---------------------------------------------------------------------------
# MedNexus — Render Blueprint (API)
#
# 1. Push this repository to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick the repo (or paste this file).
# 3. Render prompts for every `sync: false` variable — paste the real values.
#
# The API is a plain Node service; no Docker required. `src/server` is an npm
# workspace, and Render installs it standalone from that root directory.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: mednexus-api
    runtime: node
    plan: free
    region: singapore
    rootDir: src/server
    # --workspaces=false keeps this a standalone install of src/server only.
    # Without it npm resolves the repository's workspace root and installs the
    # client's production dependencies (three.js, recharts, react) too, which
    # the API never uses. src/server/package-lock.json makes the install
    # reproducible; it is generated with the same flag.
    buildCommand: npm ci --omit=dev --omit=optional --workspaces=false
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the API reads it from the environment.
      - key: MONGODB_URI
        sync: false # mongodb+srv://user:pass@cluster.mongodb.net/mednexus
      - key: JWT_SECRET
        generateValue: true # Render generates a 64-char secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # https://your-frontend.vercel.app (comma-separate extras)
      # Render terminates TLS at the edge and forwards X-Forwarded-Proto.
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Real email delivery for signup verification codes. Paste a Resend key
      # (https://resend.com/api-keys) and a sender on a domain verified there.
      # Without these, no patient can complete signup unless OTP_DEV_ECHO is on.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # MedNexus <no-reply@your-verified-domain>
      # Demo conveniences for this hosted instance (synthetic data only):
      # seed the empty database on first boot. OTP_DEV_ECHO is a fallback for
      # when RESEND_API_KEY is left empty — it echoes codes to the client, so
      # leave it unset for any deployment that touches real patient data.
      - key: SEED_ON_EMPTY
        value: "true"
      - key: OTP_DEV_ECHO
        value: "true"
      # The first administrator. No accounts are seeded, so without this the
      # deployment has nobody who can sign in. Run once, in the Render shell:
      #   npm run create-admin
      # ADMIN_PASSWORD is optional — omit it and the command generates and
      # prints a strong one.
      - key: ADMIN_EMAIL
        sync: false # you@your-clinic.example
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
