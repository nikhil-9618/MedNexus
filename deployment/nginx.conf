# ---------------------------------------------------------------------------
# MedNexus Web — nginx site config
# Serves the Vite bundle, proxies /api to the API container, applies the
# security and caching headers that a static host would otherwise provide.
# ---------------------------------------------------------------------------

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # Bumped automatically by the compression settings below.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/woff font/woff2;

  # ---- Security headers (mirrors the API's helmet policy) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  # 'unsafe-inline' styles are required by @react-three/drei injected CSS.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

  # ---- API reverse proxy (single origin => no CORS in production) ----
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ---- Immutable fingerprinted assets ----
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ---- Brand / SEO assets ----
  location ~* ^/(favicon\.svg|og-image\.svg|robots\.txt|sitemap\.xml)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or clients pin an old bundle.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # ---- SPA fallback: unknown paths render the app (custom 404 route) ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
