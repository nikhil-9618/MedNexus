[build]
  command = "npm run build"
  publish = "src/client/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  command = "npm run client"
  targetPort = 5173
  port = 8889
  publish = "src/client/dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-unavailable"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
